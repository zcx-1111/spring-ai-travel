# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  address: 0.0.0.0
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 数据源配置已合并到本文件，无需再激活druid profile
  profiles:
    active:
  # ==================== 数据源配置（Druid，与application-druid.yml合并，避免IDEA漏拷资源文件导致启动失败） ====================
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://[::1]:3307/spring_ai_travel?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
      # 从库数据源
      slave:
        enabled: false
        url:
        username:
        password:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username: ${DRUID_LOGIN_USERNAME:ruoyi}
        login-password: ${DRUID_LOGIN_PASSWORD:}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接数
          min-idle: 0
          # 连接池中的最大空闲连接数
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

  # ==================== Spring AI：阿里云百炼大模型（OpenAI兼容模式） + Qdrant向量库 ====================
  ai:
    # 通过阿里云百炼 DashScope 的 OpenAI 兼容模式接入（一个Starter同时提供对话与嵌入模型）
    openai:
      # 通过环境变量提供密钥，不要把真实密钥写入配置文件。
      api-key: ${DASHSCOPE_API_KEY:}
      # DashScope 的 OpenAI 兼容接入地址
      # 注意：Spring AI 2.0.1底层使用openai-java官方SDK，端点路径（chat/completions、
      # embeddings）不再自带/v1前缀，因此base-url必须配置到 /compatible-mode/v1
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 对话大模型配置
      # 使用 qwen3.7-flash（实测生成行程约11秒，在当前Key可用模型中速度最快）
      chat:
        options:
          model: qwen3.7-flash
          # 生成温度：0~1，越低越稳定，行程规划建议0.7兼顾稳定与灵活
          temperature: 0.7
      # 向量嵌入模型配置（把景点知识文本转向量写入Qdrant）
      embedding:
        options:
          # apikey文件指定的嵌入模型，默认输出1024维，与Qdrant集合维度一致
          model: qwen3.7-text-embedding-flash
    # Qdrant 向量数据库配置
    vectorstore:
      qdrant:
        # Qdrant服务地址（本地Docker部署默认）
        host: 127.0.0.1
        # gRPC端口（注意不是HTTP的6333）
        port: 6334
        # 景点知识库集合名称
        collection-name: scenic_knowledge
        # 本地部署未开启TLS
        use-tls: false
        # 不在应用启动时自动建集合：Qdrant未启动也不影响后端启动，
        # 集合由 ScenicKnowledgeLoader 同步知识库时按需创建
        initialize-schema: false

  # ==================== Elasticsearch：景点关键词全文检索 ====================
  # Spring Data Elasticsearch 6.x 自动装配使用的连接配置（新版 Java API Client）
  elasticsearch:
    # ES服务地址（本地Docker部署，REST端口9200；多个节点用逗号分隔）
    uris: http://127.0.0.1:9200
    # 建立连接超时时间
    connection-timeout: 3s
    # 数据读取（查询）超时时间
    socket-timeout: 10s

# 旅游业务自定义配置
travel:
  elasticsearch:
    # ES检索总开关：false=直接使用MySQL模糊查询；true=优先ES、ES异常时自动降级MySQL
    enabled: true
    # 景点索引名（需与EsScenicSpot实体@Document的indexName一致）
    index-name: scenic_spot
    # 全量同步每批条数
    sync-batch-size: 1000

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # MyBatis全局参数已改为编程式配置（见MyBatisConfig.java），无需外部mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
